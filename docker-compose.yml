services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hw
      KAFKA_BOOTSTRAP: redpanda:29092
      USE_MLFLOW: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5001
      REDIS_URL: redis://redis:6379/0
      SENTRY_DSN: https://529691c282f4e8b92d1dadf5b8f36716@o4510998097821696.ingest.de.sentry.io/4510998099591248
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redpanda
      - redis
      - mlflow
    volumes:
      - .:/app

  worker:
    build: .
    command: python -m workers.moderation_worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hw
      KAFKA_BOOTSTRAP: redpanda:29092
      USE_MLFLOW: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5001
      REDIS_URL: redis://redis:6379/0
      SENTRY_DSN: https://529691c282f4e8b92d1dadf5b8f36716@o4510998097821696.ingest.de.sentry.io/4510998099591248
    depends_on:
      - postgres
      - redpanda
      - redis
      - mlflow
    volumes:
      - .:/app

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hw
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 5

  console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PORT=6379
      - REDIS_DATABASES=1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5001
      --backend-store-uri sqlite:///mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5001:5001"
    volumes:
      - mlflow_data:/mlflow

volumes:
  pgdata:
  mlflow_data:
